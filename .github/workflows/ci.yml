name: Validate routing
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: routing-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        service: [tbank, vk, ozon, wildberries, yandex, gosuslugi, 2gis]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - if: matrix.service == 'wildberries'
        run: node scripts/observe-sources.mjs
      - name: Discover service dependencies
        env:
          SERVICE: ${{ matrix.service }}
          CERTIFICATES: ${{ matrix.service == 'tbank' && 'true' || 'false' }}
          NETWORKS: ${{ matrix.service == 'wildberries' && 'true' || 'false' }}
        run: node scripts/discover-services.mjs --service "$SERVICE" --ct "$CERTIFICATES" --networks "$NETWORKS" --out .private/discovery.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: discovery-candidates-${{ matrix.service }}
          path: .private/discovery.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm run verify
      - name: Compare route changes and protect published versions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/history-check.mjs
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - run: python3 scripts/install-cores.py
      - run: |
          export PATH="$GITHUB_WORKSPACE/.local/bin:$PATH"
          npm run verify:cores
          npm run verify:routing
          node scripts/verify-dns.mjs
