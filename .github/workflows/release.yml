name: Publish reviewed alpha
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: routing-publish
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - run: npm run verify
      - run: python3 scripts/install-cores.py
      - run: |
          export PATH="$GITHUB_WORKSPACE/.local/bin:$PATH"
          npm run verify:cores
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Create immutable prerelease with only the reviewed public files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$(node -p "require('./registry.json').releaseTag")"
          gh release create "$tag" \
            "releases/$tag/smart.xray.json" \
            "releases/$tag/smart.singbox.json" \
            "releases/$tag/smart.domains.txt" \
            "releases/$tag/release.json" \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Liberta Routing $tag" --notes-file docs/RELEASE_NOTES.md
